name: Build Packs
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  bundle:
    name: Bundle ${{ matrix.region }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        region: [eriador, gondor, rohan]
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Merge files
        run: |
          addon=addon_${{ matrix.region }}
          lang=assets/minecraft/lang/en_eq.json
          # A pack replaces lang files wholesale, so merge addon names into the base ones instead of overwriting
          if [ -f "$addon/$lang" ]; then
            jq -s '.[0] * .[1]' "base/$lang" "$addon/$lang" > "$RUNNER_TEMP/en_eq.json"
          fi
          cp -rf "$addon/." base/
          if [ -f "$RUNNER_TEMP/en_eq.json" ]; then
            mv "$RUNNER_TEMP/en_eq.json" "base/$lang"
          fi

      - name: Validate pack
        run: python3 .github/validate.py base

      - name: Set short git commit SHA
        id: vars
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Replace variables
        uses: datamonsters/replace-action@v2
        with:
          files: base/pack.mcmeta
          replacements: '@commit@=${{ steps.vars.outputs.sha_short }}'

      - name: Upload pack
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.region }}-pack
          path: base
          retention-days: 5

  packsquash:
    needs: bundle
    if: github.event_name != 'pull_request' # PRs only get preview builds
    name: Optimize ${{ matrix.region }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        region: [eriador, gondor, rohan]
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # A non-shallow repository clone is required

      - name: Download pack
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.region }}-pack
          path: base

      - name: Run PackSquash
        uses: ComunidadAylas/PackSquash-action@v4
        with:
          packsquash_version: latest
          artifact_name: ${{ matrix.region }}-pack-squashed
          options: |
            pack_directory = 'base'
            recompress_compressed_files = true

  deploy:
    needs: packsquash
    if: github.event_name != 'pull_request' # PRs only get preview builds
    name: Deploy ${{ matrix.region }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        region: [eriador, gondor, rohan]
    steps:
      - name: Download pack
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.region }}-pack-squashed

      - name: Calculate SHA1
        id: vars
        run: |
          echo "pack_sha=$(openssl sha1 pack.zip | awk '{print $2}')" >> $GITHUB_OUTPUT

      - name: Rename pack
        run: |
          mv pack.zip ${{ steps.vars.outputs.pack_sha }}.zip

      - name: Add SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Install lftp
        run: sudo apt update && sudo apt install -y lftp

      - name: Upload pack using lftp
        run: |
          lftp -e "
            set sftp:auto-confirm yes;
            open -u ${{ secrets.SSH_USERNAME }}, sftp://${{ secrets.SSH_HOST }}:${{ secrets.SSH_PORT }};
            put ${{ steps.vars.outputs.pack_sha }}.zip -o ${{ secrets.DEPLOY_DIRECTORY }}/${{ steps.vars.outputs.pack_sha }}.zip;
            bye
          "

      - name: Notify clients (send command)
        uses: fjogeleit/http-request-action@v1.16.4
        with:
          url: ${{ secrets.PANEL_URL }}/api/client/servers/${{ secrets.SERVER_ID }}/command
          method: POST
          bearerToken: ${{ secrets.API_KEY }}
          data: '{"command": "epicsuite packupdate ${{ matrix.region }} ${{ steps.vars.outputs.pack_sha }}"}'
